name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The lowest version the plugin claims to support. Anything that only works on
  # a newer PHP is a bug, not a preference.
  MIN_PHP: '8.3'

jobs:
  # ---------------------------------------------------------------------------
  # Fast feedback: syntax and packaging errors should fail in seconds, not after
  # the whole matrix has spun up.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.MIN_PHP }}
          coverage: none
          tools: composer:v2, wp-cli

      - name: Validate composer.json and composer.lock
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Check PHP syntax
        run: composer run lint

      - name: Check code style
        run: composer run format:check

      - name: The translation template must match the source
        run: |
          wp i18n make-pot . /tmp/regenerated.pot \
            --slug=ai-visibility --domain=ai-visibility \
            --exclude=vendor,tests,build,node_modules \
            --headers='{"Report-Msgid-Bugs-To":"https://github.com/Pollora/AiVisibility/issues","Last-Translator":"Pollora","Language-Team":"Pollora"}'

          # POT-Creation-Date changes on every run and says nothing about drift.
          strip() { grep -v '^"POT-Creation-Date:' "$1"; }

          if ! diff -u <(strip languages/ai-visibility.pot) <(strip /tmp/regenerated.pot); then
            echo '::error file=languages/ai-visibility.pot::out of date — run `wp i18n make-pot` and commit the result'
            exit 1
          fi

          echo 'languages/ai-visibility.pot is up to date.'

  # ---------------------------------------------------------------------------
  # Static analysis and coding standards. One PHP version is enough: PHPStan's
  # verdict does not vary with the runtime, and PHPCS is told which versions to
  # target through its own configuration.
  # ---------------------------------------------------------------------------
  analyse:
    name: Static analysis
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.MIN_PHP }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: PHPStan
        run: composer run analyse -- --error-format=github --no-progress

      - name: PHPCS
        run: vendor/bin/phpcs --report=full --report-checkstyle=phpcs-report.xml

      - name: Annotate PHPCS findings
        if: failure()
        run: vendor/bin/phpcs --report=emacs || true

  # ---------------------------------------------------------------------------
  # The test suite, across every PHP version the plugin supports.
  # ---------------------------------------------------------------------------
  test:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        include:
          - php: '8.3'
            coverage: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # pcov is far quicker than Xdebug and enough for line coverage.
          coverage: ${{ matrix.coverage && 'pcov' || 'none' }}
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          # The lock file pins the minimum PHP; let the newer runtime resolve.
          composer-options: ${{ matrix.php != '8.3' && '--ignore-platform-req=php+' || '' }}

      - name: Run tests
        if: ${{ ! matrix.coverage }}
        run: composer run test -- --no-coverage

      - name: Run tests with coverage
        if: ${{ matrix.coverage }}
        run: composer run test:coverage

  # ---------------------------------------------------------------------------
  # A single required check, so branch protection needs one rule rather than a
  # list that goes stale every time the matrix changes.
  # ---------------------------------------------------------------------------
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [lint, analyse, test]
    if: always()
    steps:
      - name: Fail if any job failed
        run: |
          if echo '${{ toJSON(needs) }}' | grep -q '"result": *"failure"'; then
            echo 'One or more CI jobs failed.'
            exit 1
          fi
          if echo '${{ toJSON(needs) }}' | grep -q '"result": *"cancelled"'; then
            echo 'One or more CI jobs were cancelled.'
            exit 1
          fi
          echo 'All CI jobs passed.'

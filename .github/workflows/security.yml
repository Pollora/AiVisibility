name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly published advisory against a dependency surfaces even
    # when nobody has pushed. Monday 06:17 UTC — off the hour to avoid the
    # scheduling stampede GitHub warns about.
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Known vulnerabilities in the dependency tree. roave/security-advisories
  # blocks a vulnerable package at install time; this catches advisories
  # published after the lock file was written.
  # ---------------------------------------------------------------------------
  dependencies:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Audit the lock file
        run: composer audit --locked --abandoned=report

  # ---------------------------------------------------------------------------
  # The WordPress security sniffs: unescaped output, unsanitised input, missing
  # nonce checks, unprepared SQL. Split out from CI so a security regression is
  # legible in the checks list rather than buried in a generic "analyse" job.
  # ---------------------------------------------------------------------------
  wordpress-sniffs:
    name: WordPress security sniffs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Run the security ruleset
        run: >
          vendor/bin/phpcs
          --standard=phpcs.xml.dist
          --sniffs=WordPress.Security.EscapeOutput,WordPress.Security.NonceVerification,WordPress.Security.ValidatedSanitizedInput,WordPress.Security.SafeRedirect,WordPress.Security.PluginMenuSlug,WordPress.DB.PreparedSQL,WordPress.DB.PreparedSQLPlaceholders,Squiz.PHP.Eval
          --report=full

  # ---------------------------------------------------------------------------
  # Pattern-based scanning for the things a linter does not model: injection
  # sinks, dangerous deserialisation, hard-coded secrets.
  # ---------------------------------------------------------------------------
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Scan
        run: >
          semgrep scan
          --config=p/php
          --config=p/security-audit
          --config=p/secrets
          --error
          --skip-unknown-extensions
          --exclude=vendor
          --exclude=tests

  # ---------------------------------------------------------------------------
  # Third-party actions are code running with access to the repository. Pinning
  # is checked so a compromised tag cannot silently change what CI executes.
  # ---------------------------------------------------------------------------
  workflow-hygiene:
    name: Workflow hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every workflow must declare a permissions block
        run: |
          missing=0
          for file in .github/workflows/*.yml; do
            if ! grep -q '^permissions:' "$file"; then
              echo "::error file=$file::no top-level permissions block; defaults to write access"
              missing=1
            fi
          done
          exit $missing

      - name: No action may be used without a version
        run: |
          if grep -rnE 'uses: +[^ ]+@(main|master) *$' .github/workflows/; then
            echo '::error::an action is pinned to a moving branch'
            exit 1
          fi
          echo 'All actions are pinned to a tag.'
